<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="popup.css"></head>
<body>
  <header><img src="../icons/icon48.png" alt=""><div><h1>DeepSeek Clicker</h1><p>Auto-continue for DeepSeek Chat</p></div></header>
  <label class="row"><span>Enabled</span><input type="checkbox" id="enabled" class="switch"></label>
  <label class="row col"><span>Click delay: <b id="dv"></b> ms</span><input type="range" id="delay" min="200" max="5000" step="100"></label>
  <div class="stat"><span>Auto clicks</span><b id="clicks">0</b></div>
  <button id="reset">Reset counter</button>
  <script src="popup.js"></script>
</body></html>
